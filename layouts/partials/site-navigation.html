<nav class="pv3 ph3 ph4-ns" role="navigation">
  <div class="flex-l justify-between items-center center">
    <div class="flex justify-between items-center w-100 w-auto-l">
      <a href="{{ .Site.Home.RelPermalink }}" class="f3 hover-black no-underline dib">
        {{ with .Site.Params.site_logo }}
          <img src="{{ . }}" class="w100 mw5-ns" alt="{{ $.Site.Title }}" />
        {{ else }}
          {{ .Site.Title }}
        {{ end }}
      </a>
      <button class="hamburger dn-l bn bg-transparent f3 pointer black" aria-label="菜单" onclick="var m=document.getElementById('nav-menu');m.classList.toggle('open');this.textContent=m.classList.contains('open')?'✕':'☰'">☰</button>
    </div>
    <div id="nav-menu" class="flex-l items-center nav-menu">
      {{ partial "i18nlist.html" . }}
      {{ if .Site.Menus.main }}
        <ul class="pl0 mr3">
          {{ range .Site.Menus.main }}
          <li class="list f5 f4-ns fw4 dib-l pr3-l">
            <a class="hover-black no-underline black-80 db pv2 pv0-l" href="{{ .URL }}" title="{{ .Name }} page">
              {{ .Name }}
            </a>
          </li>
          {{ end }}
        </ul>
      {{ end }}
      {{ partialCached "social-follow.html" . }}
    </div>
  </div>
</nav>
<style>
  @media screen and (max-width: 60em) {
    .hamburger { display: block; }
    .nav-menu { display: none; }
    .nav-menu.open { display: block; }
    .nav-menu ul { margin-top: 1rem; }
    .nav-menu li { display: block; padding: 0.5rem 0; }
  }
</style>
