{{/* Embed the current page's audio with custom player

usage:
{{< embed-this-specific-audio-with-player >}}
*/}}

<div class="sf-player">
  <button class="sf-play" aria-label="播放">▶</button>
  <div class="sf-progress"><div class="sf-progress-bar"></div></div>
  <span class="sf-time">0:00 / 0:00</span>
  <button class="sf-speed">1x</button>
  <audio preload="metadata">
    <source src="{{ $.Page.Site.Params.statsPrefix }}{{ $.Page.Params.mp3 | string }}" type="audio/mpeg">
  </audio>
</div>
