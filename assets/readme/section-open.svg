<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="140" viewBox="0 0 1200 140" role="img" aria-labelledby="title desc">
  <title id="title">打开书房</title>
  <desc id="desc">从网站开始收听、翻阅书目，进入一个人的书房。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFEFB"/><stop offset="1" stop-color="#F3EEE6"/>
    </linearGradient>
    <clipPath id="frame"><rect width="1200" height="140" rx="20"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1200" height="140" rx="20" fill="url(#bg)"/>
    <circle cx="1120" cy="20" r="90" fill="#408bc9" fill-opacity=".07"/>
    <rect x="48" y="42" width="36" height="5" rx="2.5" fill="#408bc9"/>
    <text x="48" y="88" fill="#222222" font-size="42" font-weight="700" letter-spacing="4" font-family="'Noto Serif SC',Georgia,'Songti SC','PingFang SC',serif">打开书房</text>
    <text x="280" y="88" fill="#6B6560" font-size="22" font-family="'Noto Sans SC',-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif">shufang.org · 听朗读，见书目</text>
    <g transform="translate(980 34)">
      <rect x="8" y="8" width="42" height="3" rx="1" fill="#222"/>
      <rect x="12" y="18" width="6" height="36" rx="1" fill="#222"/>
      <rect x="20" y="24" width="5" height="30" rx="1" fill="#555"/>
      <rect x="27" y="16" width="6" height="38" rx="1" fill="#408bc9"/>
      <rect x="35" y="22" width="5" height="32" rx="1" fill="#B33A2B"/>
      <rect x="42" y="20" width="6" height="34" rx="1" fill="#333" transform="rotate(-8 45 54)"/>
      <rect x="8" y="54" width="48" height="3" rx="1" fill="#222"/>
    </g>
  </g>
</svg>
