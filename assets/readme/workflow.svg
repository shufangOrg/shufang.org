<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-labelledby="title desc">
  <title id="title">书房如何运转</title>
  <desc id="desc">选书、原文朗读、整理发布、安静收听——四个彼此衔接的步骤。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFEFB"/><stop offset="1" stop-color="#F3EEE6"/>
    </linearGradient>
    <clipPath id="frame"><rect width="1200" height="280" rx="24"/></clipPath>
  </defs>
  <g clip-path="url(#frame)" font-family="'Noto Sans SC',-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif">
    <rect width="1200" height="280" rx="24" fill="url(#bg)"/>
    <text x="48" y="48" fill="#7A7368" font-size="15" font-weight="700" letter-spacing="2.4">HOW IT WORKS</text>
    <text x="48" y="88" fill="#222222" font-size="34" font-weight="700" letter-spacing="3" font-family="'Noto Serif SC',Georgia,'Songti SC',serif">从一本书，到一段安静的声音</text>

    <!-- steps -->
    <g transform="translate(48 130)">
      <g>
        <rect width="240" height="110" rx="18" fill="#FFFFFF" stroke="#E2DACF" stroke-width="1.5"/>
        <rect x="20" y="22" width="28" height="5" rx="2.5" fill="#408bc9"/>
        <text x="20" y="58" fill="#222222" font-size="24" font-weight="700" font-family="'Noto Serif SC',Georgia,serif">选书</text>
        <text x="20" y="88" fill="#6B6560" font-size="16">爱书人各自挑选想读的书</text>
      </g>
      <path d="M252 55h36" stroke="#408bc9" stroke-width="3" stroke-linecap="round"/>
      <circle cx="296" cy="55" r="4" fill="#408bc9"/>
      <g transform="translate(300 0)">
        <rect width="240" height="110" rx="18" fill="#FFFFFF" stroke="#E2DACF" stroke-width="1.5"/>
        <rect x="20" y="22" width="28" height="5" rx="2.5" fill="#408bc9"/>
        <text x="20" y="58" fill="#222222" font-size="24" font-weight="700" font-family="'Noto Serif SC',Georgia,serif">朗读</text>
        <text x="20" y="88" fill="#6B6560" font-size="16">原文朗读，不加背景音乐</text>
      </g>
      <path d="M552 55h36" stroke="#408bc9" stroke-width="3" stroke-linecap="round"/>
      <circle cx="596" cy="55" r="4" fill="#408bc9"/>
      <g transform="translate(600 0)">
        <rect width="240" height="110" rx="18" fill="#FFFFFF" stroke="#E2DACF" stroke-width="1.5"/>
        <rect x="20" y="22" width="28" height="5" rx="2.5" fill="#408bc9"/>
        <text x="20" y="58" fill="#222222" font-size="24" font-weight="700" font-family="'Noto Serif SC',Georgia,serif">整理</text>
        <text x="20" y="88" fill="#6B6560" font-size="16">写入本仓库，发布到网站</text>
      </g>
      <path d="M852 55h36" stroke="#408bc9" stroke-width="3" stroke-linecap="round"/>
      <circle cx="896" cy="55" r="4" fill="#408bc9"/>
      <g transform="translate(900 0)">
        <rect width="240" height="110" rx="18" fill="#FFFFFF" stroke="#E2DACF" stroke-width="1.5"/>
        <rect x="20" y="22" width="28" height="5" rx="2.5" fill="#408bc9"/>
        <text x="20" y="58" fill="#222222" font-size="24" font-weight="700" font-family="'Noto Serif SC',Georgia,serif">收听</text>
        <text x="20" y="88" fill="#6B6560" font-size="16">在书房里安静地听下去</text>
      </g>
    </g>
  </g>
</svg>
