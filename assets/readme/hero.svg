<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">一个人的书房</title>
  <desc id="desc">爱书人原文朗读的网络电台。用声音回到文字本身，让每本书变成你自己的房间。</desc>

  <defs>
    <linearGradient id="paper-wash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2A241F"/>
      <stop offset="0.55" stop-color="#1C1917"/>
      <stop offset="1" stop-color="#151311"/>
    </linearGradient>
    <linearGradient id="shelf-wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6B4F3A"/>
      <stop offset="1" stop-color="#4A3426"/>
    </linearGradient>
    <linearGradient id="mark-metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D8D2C6"/>
      <stop offset="1" stop-color="#9C9488"/>
    </linearGradient>
    <clipPath id="frame">
      <rect width="1200" height="360" rx="24"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="360" rx="24" fill="url(#paper-wash)"/>
    <circle cx="1080" cy="40" r="150" fill="#408bc9" fill-opacity=".07"/>
    <circle cx="980" cy="320" r="120" fill="#B33A2B" fill-opacity=".05"/>

    <g stroke="#F5F0E8" stroke-opacity=".04" stroke-width="1">
      <path d="M0 78h1200M0 156h1200M0 234h1200M0 312h1200"/>
    </g>

    <g transform="translate(56 48)" font-family="'Noto Serif SC',Georgia,'Songti SC','PingFang SC',serif">
      <text x="0" y="18" fill="#9C9488" font-size="16" font-weight="700" letter-spacing="3.2" font-family="'Noto Sans SC',-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif">NETWORK RADIO · SINCE 2013</text>
      <rect x="0" y="36" width="42" height="5" rx="2.5" fill="#408bc9"/>

      <text x="0" y="118" fill="#F5F0E8" font-size="64" font-weight="700" letter-spacing="6">一个人的书房</text>
      <rect id="title-underline" x="2" y="136" width="420" height="10" rx="5" fill="#408bc9" fill-opacity=".85"/>

      <text x="0" y="196" fill="#E7E0D4" font-size="24" font-weight="500">用声音回到文字本身。</text>
      <text x="0" y="236" fill="#B8AFA2" font-size="20">若以书而论，每本书都会变成你自己的房间。</text>

      <text x="0" y="286" fill="#7E766B" font-size="15" font-weight="650" letter-spacing="1.6" font-family="'Noto Sans SC',-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif">原文朗读 · 无背景音乐 · shufang.org</text>
    </g>

    <g id="motion-shelf-books" transform="translate(690 42)" font-family="'Noto Sans SC',-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif">
      <rect x="18" y="46" width="10" height="214" rx="2" fill="#3D2E22"/>
      <rect x="372" y="46" width="10" height="214" rx="2" fill="#3D2E22"/>
      <rect x="28" y="52" width="344" height="196" rx="4" fill="#241C16"/>
      <rect x="12" y="248" width="376" height="16" rx="3" fill="url(#shelf-wood)"/>
      <rect x="12" y="260" width="376" height="6" fill="#2C2118"/>

      <rect x="48" y="88" width="28" height="160" rx="3" fill="#B33A2B"/>
      <rect x="80" y="108" width="22" height="140" rx="3" fill="#F0E6D6"/>
      <rect x="106" y="72" width="30" height="176" rx="3" fill="#408bc9"/>
      <rect x="140" y="98" width="24" height="150" rx="3" fill="#2B2622"/>
      <rect x="168" y="84" width="32" height="164" rx="3" fill="#D97706"/>
      <rect x="204" y="112" width="20" height="136" rx="3" fill="#C4B49A"/>
      <rect x="228" y="78" width="26" height="170" rx="3" fill="#6B8F71"/>
      <rect x="258" y="100" width="22" height="148" rx="3" fill="#8B3A2F"/>
      <g transform="rotate(-10 318 248)">
        <rect x="292" y="92" width="28" height="156" rx="3" fill="#E8DCC8"/>
        <rect x="298" y="108" width="16" height="8" rx="2" fill="#9C9488" fill-opacity=".55"/>
        <rect x="298" y="128" width="16" height="8" rx="2" fill="#9C9488" fill-opacity=".35"/>
      </g>

      <rect x="54" y="120" width="16" height="3" rx="1.5" fill="#F5F0E8" fill-opacity=".35"/>
      <rect x="114" y="110" width="14" height="3" rx="1.5" fill="#F5F0E8" fill-opacity=".45"/>
      <rect x="176" y="126" width="16" height="3" rx="1.5" fill="#1C1917" fill-opacity=".25"/>
      <rect x="234" y="118" width="14" height="3" rx="1.5" fill="#F5F0E8" fill-opacity=".35"/>

      <text x="18" y="292" fill="#9C9488" font-size="15" font-weight="650" letter-spacing="1.4">SHELF · 书目与朗读</text>
    </g>

    <g id="motion-headphone-mark" transform="translate(980 200)">
      <rect x="8" y="10" width="148" height="108" rx="18" fill="#0E0C0A" fill-opacity=".45"/>
      <rect width="148" height="108" rx="18" fill="#2A241F"/>
      <rect x="1" y="1" width="146" height="106" rx="17" fill="none" stroke="#408bc9" stroke-opacity=".35" stroke-width="1.5"/>

      <path d="M42 46c0-18 16-30 32-30s32 12 32 30" fill="none" stroke="url(#mark-metal)" stroke-width="7" stroke-linecap="round"/>
      <rect x="34" y="44" width="18" height="34" rx="7" fill="url(#mark-metal)"/>
      <rect x="96" y="44" width="18" height="34" rx="7" fill="url(#mark-metal)"/>
      <rect x="56" y="48" width="8" height="30" rx="1.5" fill="#B33A2B"/>
      <rect x="66" y="52" width="7" height="26" rx="1.5" fill="#D97706"/>
      <rect x="75" y="46" width="8" height="32" rx="1.5" fill="#408bc9"/>
      <rect x="85" y="50" width="7" height="28" rx="1.5" fill="#F0E6D6"/>

      <text x="16" y="96" fill="#B8AFA2" font-size="13" font-weight="700" letter-spacing="1.2" font-family="'Noto Sans SC',-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif">LISTEN · 用声音裸泳</text>
    </g>
  </g>
</svg>
