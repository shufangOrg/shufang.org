<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="140" viewBox="0 0 1200 140" role="img" aria-labelledby="title desc">
  <title id="title">本地预览</title>
  <desc id="desc">用 Hugo 与 Nix 开发环境构建并预览这个网站仓库。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFEFB"/><stop offset="1" stop-color="#F3EEE6"/>
    </linearGradient>
    <clipPath id="frame"><rect width="1200" height="140" rx="20"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1200" height="140" rx="20" fill="url(#bg)"/>
    <rect x="48" y="42" width="36" height="5" rx="2.5" fill="#408bc9"/>
    <text x="48" y="88" fill="#222222" font-size="42" font-weight="700" letter-spacing="4" font-family="'Noto Serif SC',Georgia,'Songti SC','PingFang SC',serif">本地预览</text>
    <text x="260" y="88" fill="#6B6560" font-size="22" font-family="'Noto Sans SC',-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif">Hugo 站点仓库 · Nix 开发环境</text>
    <g transform="translate(980 40)" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">
      <rect width="160" height="60" rx="12" fill="#222222"/>
      <circle cx="18" cy="18" r="4" fill="#B33A2B"/>
      <circle cx="34" cy="18" r="4" fill="#D97706"/>
      <circle cx="50" cy="18" r="4" fill="#6B8F71"/>
      <text x="18" y="42" fill="#F6F3EE" font-size="14">$ hugo server</text>
    </g>
  </g>
</svg>
